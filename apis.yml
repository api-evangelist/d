description: 'Downjoy (当乐网, d.cn) is a Chinese mobile game distribution and community
  platform operated by Beijing Downjoy Information Technology Co., Ltd (北京当乐信息技术有限公司).
  The site offers mobile game downloads, gaming news and original editorial content,
  game-related video, community features, and game rankings and recommendations. Downjoy
  also runs an open platform at open.d.cn where game publishers and developers register,
  create and submit games, integrate the Downjoy SDK, and manage launch and updates.
  Surfaced as a portfolio company of Qiming Venture Partners and added to the API
  Evangelist network; enriched with verified public identity and infrastructure probes.'
